[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Gateway distribuído de LLMs abertos com streaming SSE (Projeto 1, Redes de Computadores/UFES)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Roteador semântico (trilha Inteligência): opcional e desligado nos perfis padrão.
router = [
    "numpy>=2",
    "scikit-learn>=1.6",
]
# Gráficos do experimento.
experiments = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"
llm-gateway-client = "llm_gateway.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# lab.py roda com o Python da máquina do laboratório (3.8+), antes de existir o .venv.
"lab.py" = ["UP036"]
# Fórmulas em português usam − e × de propósito.
"experiments/*.py" = ["RUF001", "RUF002"]
"src/llm_gateway/prompts.py" = ["E501"]
"tests/test_protocol_and_clinical.py" = ["RUF001"]
